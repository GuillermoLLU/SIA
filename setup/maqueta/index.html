<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIA Setup · maqueta (#143)</title>
<!-- Maqueta del instalador de SIA (#143): la ventana real de SIA Setup (../ui) con un simulador en
     lugar de Rust (simulador.js), para ver cada caso sin instalar nada. La barra de arriba es de la
     maqueta: elige el escenario. Lo que se ve dentro es exactamente lo de producción. -->
<style>
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; font-family: "Helvetica Now Text SW10", "Helvetica Neue", Helvetica, Arial, sans-serif; background: #d9dcdf; }
.mock { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; width: 760px; box-sizing: border-box; padding: 12px 16px; font-size: 12px; color: #333; background: rgba(255, 255, 255, .7); border: 1px dashed #9aa0a6; }
.mock b { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5f6368; }
.mock label { display: inline-flex; align-items: center; gap: 6px; }
.mock fieldset { display: inline-flex; gap: 2px; margin: 0; padding: 0; border: 0; }
.mock fieldset button { padding: 4px 8px; font: inherit; background: none; border: 1px solid transparent; cursor: pointer; }
.mock fieldset button[aria-pressed="true"] { background: #fff; border-color: #9aa0a6; }
.mock select { padding: 4px 6px; font: inherit; background: #fff; border: 1px solid #9aa0a6; }
.mock-reset { margin-left: auto; padding: 4px 10px; font: inherit; background: #fff; border: 1px solid #9aa0a6; cursor: pointer; }
.frame { width: 760px; height: 500px; overflow: hidden; background: #fff; border: 1px solid rgba(0, 0, 0, .18); border-radius: 8px; box-shadow: 0 24px 60px rgba(0, 0, 0, .25); transition: opacity .25s ease, transform .25s ease; }
.frame.closing { opacity: 0; transform: scale(.97); }
.frame iframe { display: block; width: 100%; height: 100%; border: 0; }
.toast { min-height: 18px; font-size: 12px; color: #333; }
</style>
</head>
<body>

<div class="mock" aria-label="Controles de la maqueta">
  <b>Maqueta</b>
  <label>Escenario <fieldset data-mock="modo"><button data-v="install" aria-pressed="true">Primera instalación</button><button data-v="update">Actualización</button><button data-v="uninstall">Desinstalación</button></fieldset></label>
  <label data-only="update uninstall"><input type="checkbox" data-abierto> SIA abierto</label>
  <label data-only="uninstall"><input type="checkbox" data-falla> Falla la desinstalación (INS-501)</label>
  <label>Sistema <fieldset data-mock="sistema"><button data-v="win" aria-pressed="true">Windows</button><button data-v="mac" data-sistema-mac>Mac</button></fieldset></label>
  <label>Comprobaciones
    <select data-escenario>
      <option value="ok">Todo bien</option>
      <optgroup label="Certificados del cliente">
        <option value="cert">Falta un certificado</option>
        <option value="cert-unk">No se pueden comprobar</option>
        <option value="cert-descarga" data-solo="install">Faltan y Copilot no se puede descargar</option>
      </optgroup>
      <optgroup label="Copilot CLI (primera instalación)">
        <option value="copilot-instala" data-solo="install">No está: se instala con WinGet</option>
        <option value="sin-winget" data-solo="install">Sin WinGet</option>
        <option value="politica" data-solo="install">Una política del equipo lo impide</option>
        <option value="descarga" data-solo="install">No se puede descargar</option>
        <option value="error" data-solo="install">Otro fallo de WinGet, con su código</option>
        <option value="tiempo" data-solo="install">No termina de instalarse</option>
        <option value="copilot-unk" data-solo="install">No se puede comprobar</option>
      </optgroup>
      <optgroup label="Sesión de Copilot (primera instalación)">
        <option value="sin-sesion" data-solo="install">Sin sesión: «Iniciar sesión»</option>
        <option value="sesion-unk" data-solo="install">No se puede comprobar</option>
      </optgroup>
      <optgroup label="Errores">
        <option value="copilot-raro" data-solo="install">Una respuesta que no conocemos (INS-900)</option>
        <option value="instala-falla" data-solo="install update">Falla la instalación (INS-401)</option>
        <option value="sin-paquete" data-solo="install update">Falta lo que hay que instalar (INS-405)</option>
      </optgroup>
    </select>
  </label>
  <button class="mock-reset" data-reset>Empezar de nuevo</button>
</div>

<div class="frame"><iframe title="SIA Setup" data-frame></iframe></div>
<div class="toast" data-toast></div>

<script>
const $ = (s) => document.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const S = { modo: 'install', sistema: 'win', abierto: false, escenario: 'ok' };
const frame = $('[data-frame]');
// cada cambio vuelve a abrir la ventana desde el principio, con su escenario
function load() {
  $$('[data-only]').forEach((x) => { x.hidden = !x.dataset.only.split(' ').includes(S.modo); });
  // al desinstalar no hay comprobaciones: el selector, fuera
  $('[data-escenario]').closest('label').hidden = S.modo === 'uninstall';
  // en Mac no hay desinstalador: SIA se lleva a la Papelera
  $$('[data-sistema-mac]').forEach((x) => { x.hidden = S.modo === 'uninstall'; });
  if (S.modo === 'uninstall' && S.sistema === 'mac') $('[data-mock=sistema] [data-v=win]').click();
  $$('[data-solo]').forEach((o) => { o.disabled = !o.dataset.solo.split(' ').includes(S.modo); });
  if ($('[data-escenario]').selectedOptions[0]?.disabled) { $('[data-escenario]').value = 'ok'; S.escenario = 'ok'; }
  const q = new URLSearchParams({ escenario: S.modo === 'uninstall' && S.falla ? 'desinstala-falla' : S.escenario, modo: S.modo, sistema: S.sistema, abierto: S.abierto ? '1' : '0' });
  frame.src = `ventana.html?${q}`;
}
for (const fs of $$('[data-mock]')) {
  fs.onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    S[fs.dataset.mock] = b.dataset.v;
    $$('button', fs).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    load();
  };
}
$('[data-escenario]').onchange = (e) => { S.escenario = e.target.value; load(); };
$('[data-abierto]').onchange = (e) => { S.abierto = e.target.checked; load(); };
$('[data-falla]').onchange = (e) => { S.falla = e.target.checked; load(); };
$('[data-reset]').onclick = load;
let toastT;
const toast = (t) => { $('[data-toast]').textContent = `(maqueta) ${t}`; clearTimeout(toastT); toastT = setTimeout(() => { $('[data-toast]').textContent = ''; }, 3000); };
addEventListener('message', (e) => {
  if (e.data?.sia === 'aviso') toast(e.data.texto);
  if (e.data?.sia === 'cerrar') { toast('La ventana se cerraría'); $('.frame').classList.add('closing'); setTimeout(() => { $('.frame').classList.remove('closing'); load(); }, 900); }
});
load();
</script>
</body>
</html>
