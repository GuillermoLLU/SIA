<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIA - Flujo de una incidencia</title><style>/* Base de las presentaciones (estilo corporativo Minsait · Indra Group): 16:9, fondo arena, tinta azul
   oscuro, Arial, una idea por diapositiva, logo arriba a la izquierda, línea vertical a la derecha y número
   de página abajo. Se navega con ← → o espacio, F pantalla completa; se imprime a PDF 16:9 desde el navegador. */
:root { --bg: #E3E2DA; --ink: #003F50; --dark: #002530; --gray: #696A61; --line: #6C929A; --muted: #ADAEA5;
  --ok: #2E7D4F; --tk: #B8860B; --no: #B03A2E; --soft: #EDECE6; }
* { box-sizing: border-box; }
body { margin: 0; background: #bfc1bc; font-family: Arial, Helvetica, sans-serif; color: var(--ink); display: grid; place-items: center; min-height: 100vh; }
.deck { width: min(100vw, 177.7778vh); aspect-ratio: 16 / 9; position: relative; background: var(--bg); overflow: hidden; box-shadow: 0 4px 30px #0002; container-type: inline-size; }
.slide { position: absolute; inset: 0; display: none; background: var(--bg); }
.slide.active { display: block; }
.brand { position: absolute; top: 4.6%; left: 2.65%; width: 15.5%; height: 7.2%; object-fit: contain; object-position: left top; }
.divider { position: absolute; left: 77.35%; top: 0; height: 90.5%; border-left: 1px solid var(--line); }
.page { position: absolute; bottom: 4%; left: 2.65%; font-size: 1cqw; color: var(--gray); }
.side { position: absolute; left: 79.5%; top: 20%; width: 17%; font-size: 1.15cqw; line-height: 1.45; color: var(--gray); }
.side b { color: var(--ink); display: block; font-size: 1.3cqw; margin-bottom: .6cqw; }
.content { position: absolute; left: 6%; top: 19%; width: 68%; height: 70%; }
.kick { font-size: 1.05cqw; letter-spacing: .16em; text-transform: uppercase; color: var(--gray); margin-bottom: 1.2cqw; }
h1 { font-weight: 400; letter-spacing: -.035em; font-size: 4.1cqw; line-height: 1.12; margin: 0; }
h2 { font-weight: 400; font-size: 3.1cqw; margin: 0 0 2.4cqw; letter-spacing: -.02em; }
.lead { font-size: 1.9cqw; line-height: 1.45; max-width: 95%; }
.lead b { font-weight: 700; }
.center-title { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 7%; }
.center-title h1 { font-size: 4.4cqw; }
.cover .content { top: 30%; }
.cover .who { margin-top: 4cqw; font-size: 1.25cqw; color: var(--gray); line-height: 1.6; }
.cover .who b { color: var(--ink); font-weight: 400; }
/* bloques */
.cards { display: grid; gap: 1.4cqw; }
.cards.c3 { grid-template-columns: repeat(3, 1fr); } .cards.c4 { grid-template-columns: repeat(4, 1fr); } .cards.c2 { grid-template-columns: 1fr 1fr; }
.card { background: #fff; border-left: .35cqw solid var(--ink); padding: 1.4cqw 1.6cqw; font-size: 1.3cqw; line-height: 1.4; color: var(--gray); }
.card b { display: block; color: var(--ink); font-size: 1.55cqw; font-weight: 700; margin-bottom: .5cqw; }
.num { font-size: 4.6cqw; color: var(--ink); line-height: 1; letter-spacing: -.03em; }
.num small { font-size: 1.2cqw; color: var(--gray); letter-spacing: 0; display: block; margin-top: .7cqw; }
.dot { display: inline-block; width: 1cqw; height: 1cqw; border-radius: 50%; margin-right: .6cqw; vertical-align: .05cqw; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { font-size: 1.9cqw; padding: 1.1cqw 0; border-bottom: 1px solid var(--muted); display: flex; gap: 1.4cqw; align-items: baseline; }
.list li .where { color: var(--gray); font-size: 1.3cqw; margin-left: auto; text-align: right; }
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1cqw; margin-top: 2cqw; }
.step { border-top: .35cqw solid var(--ink); padding-top: 1.2cqw; font-size: 1.3cqw; line-height: 1.4; color: var(--gray); }
.step i { font-style: normal; font-size: 2.6cqw; color: var(--ink); display: block; margin-bottom: .6cqw; }
.step b { color: var(--ink); display: block; font-size: 1.45cqw; margin-bottom: .4cqw; }
/* decisiones */
.dec { display: grid; gap: .7cqw; }
.dec .d { display: grid; grid-template-columns: 3cqw 1fr 1.35fr 9cqw; gap: 1.2cqw; align-items: center; background: #fff; padding: .95cqw 1.3cqw; cursor: pointer; }
.dec .n { font-size: 2cqw; color: var(--line); text-align: center; }
.dec .q { font-size: 1.45cqw; color: var(--ink); font-weight: 700; }
.dec .r { font-size: 1.2cqw; color: var(--gray); line-height: 1.35; }
.dec .st { font-size: 1cqw; text-align: center; padding: .4cqw .6cqw; background: var(--soft); color: var(--gray); }
.dec .d.yes { background: #eef5ef; } .dec .d.yes .st { background: var(--ok); color: #fff; }
.dec .d.later { background: #f7f1e3; } .dec .d.later .st { background: var(--tk); color: #fff; }
/* diagrama */
.graph { width: 100%; height: 100%; overflow: visible; }
.graph .node rect { stroke: var(--ink); stroke-width: 1.5; fill: #fff; }
.graph .node text { font-family: Arial, Helvetica, sans-serif; font-weight: 600; fill: var(--ink); font-size: 15px; text-anchor: middle; dominant-baseline: middle; }
.graph .node.primary rect { fill: var(--ink); } .graph .node.primary text { fill: #fff; }
.graph .node.secondary rect { fill: var(--muted); stroke: var(--muted); }
.graph .node.dash rect { stroke-dasharray: 5 4; }
.graph .node { cursor: pointer; }
.graph .edge { stroke: var(--ink); stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
.graph .edge.dash { stroke-dasharray: 5 4; }
.graph .edge-label { font-size: 12px; fill: var(--gray); text-anchor: middle; font-style: italic; }
.graph .sect { font-size: 11px; letter-spacing: .16em; fill: var(--gray); }
dialog { border: 0; padding: 2cqw 2.4cqw; max-width: 46cqw; background: var(--bg); color: var(--ink); box-shadow: 0 10px 40px #0004; font-size: 1.35cqw; line-height: 1.5; }
dialog h3 { margin: 0 0 .8cqw; font-weight: 400; font-size: 2cqw; }
dialog::backdrop { background: #00253033; }
/* navegación */
.nav { position: fixed; bottom: 14px; right: 20px; display: flex; align-items: center; gap: 8px; }
.nav button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 2px; padding: 8px 13px; cursor: pointer; font-size: 16px; }
.nav span { font-size: 13px; color: var(--ink); min-width: 40px; text-align: center; }
body.fullscreen .nav { opacity: .15; } body.fullscreen .nav:hover { opacity: 1; }
@media print {
  @page { size: 16in 9in; margin: 0; }
  html, body { display: block; width: 16in; height: auto; background: white; }
  .deck { width: 16in; height: auto; aspect-ratio: auto; box-shadow: none; overflow: visible; }
  .slide { position: relative; width: 16in; height: 9in; display: block !important; page-break-after: always; }
  .nav { display: none; }
}

/* Diapositiva ancha (diagramas completos y rejillas): sin línea vertical, a todo el ancho */
.slide.wide .content { left: 3%; width: 94%; top: 14%; height: 80%; }
.legend { display: flex; gap: 2cqw; font-size: 1cqw; color: var(--gray); margin: -.4cqw 0 .6cqw; flex-wrap: wrap; }
.legend i { display: inline-block; width: .9cqw; height: .9cqw; border-radius: 50%; margin-right: .5cqw; vertical-align: -.05cqw; }
svg.fullflow { width: 100%; height: 92%; display: block; }
/* Tarjetas por fase */
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .9cqw; }
.ph { background: #fff; padding: .8cqw 1cqw .9cqw; border: 1px solid #d6d5cc; }
.ph.k-paso { background: #f1f2ef; } .ph.k-camino { background: #eaf1f6; } .ph.k-siempre { background: #f6f3ea; }
.ph h3 { margin: 0 0 .5cqw; font-size: 1.15cqw; color: var(--ink); display: flex; gap: .6cqw; align-items: baseline; flex-wrap: wrap; font-weight: 700; }
.ph h3 small { color: var(--line); font-size: .8cqw; letter-spacing: .1em; }
.ph.k-paso h3 small { color: var(--dark); } .ph.k-camino h3 small { color: #1f6fd1; } .ph.k-siempre h3 small { color: #8a7a55; }
.ph ul { list-style: none; margin: 0; padding: 0; }
.ph li { display: grid; grid-template-columns: 4.6cqw 1fr 1cqw; gap: .5cqw; align-items: start; font-size: .92cqw; line-height: 1.28; padding: .3cqw 0; border-top: 1px solid #eceae2; color: var(--ink); }
.ph li:first-child { border-top: 0; }
.ph.wide { grid-column: span 2; } .ph.wide ul { display: grid; grid-template-columns: 1fr 1fr; column-gap: 1.2cqw; } .ph.wide li:nth-child(2) { border-top: 0; }
.sys { font-size: .72cqw; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: .1cqw .3cqw; text-align: center; }
.sys.r { background: #dff1f2; color: #0b7f88; } .sys.j { background: #e1ebf8; color: #1f5fb8; } .sys.s { background: #e9e4f6; color: #5a3fa8; } .sys.t { background: #e8eaeb; color: #5b6870; }
:is(.ph, .sum) .st { display: inline-block; width: .85cqw; height: .85cqw; border-radius: 50%; margin-top: .2cqw; }
:is(.ph, .sum) .st.ok { background: var(--ok); } :is(.ph, .sum) .st.no { background: var(--no); } :is(.ph, .sum) .st.out { background: #b9c1c6; } :is(.ph, .sum) .st.tk { background: var(--tk); }
.sum { display: flex; gap: 2cqw; font-size: 1cqw; color: var(--gray); margin: 0 0 1cqw; }
.sum span { display: inline-flex; align-items: center; gap: .5cqw; } .sum b { color: var(--ink); }
</style></head><body>

<script>
(() => {
  const slides = [...document.querySelectorAll('.slide')];
  let cur = Math.max(0, slides.findIndex((s) => s.classList.contains('active')));
  const count = document.getElementById('count');
  const go = (i) => { cur = Math.max(0, Math.min(slides.length - 1, i)); slides.forEach((s, k) => s.classList.toggle('active', k === cur)); count.textContent = `${cur + 1} / ${slides.length}`; history.replaceState(null, '', '#' + (cur + 1)); };
  const fs = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
  document.getElementById('prev').onclick = () => go(cur - 1);
  document.getElementById('next').onclick = () => go(cur + 1);
  document.getElementById('fs').onclick = fs;
  document.addEventListener('fullscreenchange', () => document.body.classList.toggle('fullscreen', !!document.fullscreenElement));
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('dialog, textarea, input')) return;
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(cur + 1); }
    if (['ArrowLeft', 'PageUp'].includes(e.key)) go(cur - 1);
    if (e.key === 'Home') go(0);
    if (e.key === 'End') go(slides.length - 1);
    if (e.key.toLowerCase() === 'f') fs();
  });
  const n = parseInt(location.hash.slice(1), 10);
  go(Number.isFinite(n) ? n - 1 : cur);
})();


(() => {
