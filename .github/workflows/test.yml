name: test

# Las pruebas de dominio (npm test) y la compilación de la web, en cada pull
# request y en cada push a develop y main. Lo que no pase aquí no entra.
on:
  push:
    branches: ['main', 'develop']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencias
        run: |
          (cd server && npm ci --no-audit --no-fund)
          (cd web && npm ci --no-audit --no-fund)
          (cd mcp && npm ci --no-audit --no-fund)
      - name: Pruebas
        run: npm test
      - name: Web
        run: cd web && npx vite build
